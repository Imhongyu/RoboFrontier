# Four-task engineering test; does not replace the 36-task/24-hour defaults.
# Copy to an untracked site TOML and review Slurm resources before submitting.
[policy]
engine = "codex"
profile = "luna"
effort = "high"
topology = "adaptive"

[batch]
parallel = 4
task_wall_limit_s = 3600.0

[selection]
level = 3
cases = ["transport-a12-d3", "mosaic-a08-12x24-d3", "relay-a16-d3", "dial-best5-n08-d3"]

[render]
device = "cpu"

[slurm]
gpus = 0
time_limit_s = 7200
# Partition/account/CPU/memory/scratch otherwise inherit the root defaults.
# These are resource requests, not a tested capacity guarantee.
