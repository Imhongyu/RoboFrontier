<!doctype html><html lang="en"><meta charset="utf-8"><title>RoboFrontier — Meta + Workers</title>
<style>body{background:#111827;color:#e5e7eb;font:15px system-ui;margin:32px}h1{font-size:24px}.cards{display:flex;gap:16px}.card{padding:18px;background:#1f2937;border-radius:12px;flex:1}pre{white-space:pre-wrap;word-break:break-word}section{margin-top:24px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #374151}.pill{color:#93c5fd}small{color:#9ca3af}</style>
<h1>RoboFrontier · Legacy shared world | Meta management | Controller + Workers</h1><p id="run"></p><p id="health"></p><div class="cards" id="agents"></div>
<section><h2>Running actions</h2><div id="jobs"></div></section>
<section><h2>Work messages</h2><table><thead><tr><th>ID</th><th>Sender → Recipients</th><th>Text</th></tr></thead><tbody id="messages"></tbody></table></section>
<section><h2>Engineering events</h2><pre id="events"></pre></section>
<script>const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');async function refresh(){try{const s=await(await fetch('/state')).json();document.querySelector('#run').textContent=`Simulation ${s.sim_time_s.toFixed(1)} s · ${s.lifecycle==='interrupted'?'Interrupted':s.lifecycle==='recovery_required'?'Engineering verification required':s.ended?'Ended':s.started?'Running':'Waiting for READY / START (legacy protocol)'} · ${s.recording?'Recording':''}`;const h=s.dispatcher_health??{},ago=t=>t?Math.max(0,Math.round(Date.now()/1000-t))+' s ago':'No record yet';document.querySelector('#health').textContent=`Dispatcher observation: ${ago(h.last_successful_observation_at)} · Latest delivery: ${ago(h.last_delivery_at)}${s.dispatcher_paused?' · Dispatch paused':''}${h.last_error?' · Latest error: '+h.last_error.reason:''}`;document.querySelector('#agents').innerHTML=Object.entries(s.agents).sort(([a],[b])=>(a==='Meta'?-2:a==='Coordinator'?-1:0)-(b==='Meta'?-2:b==='Coordinator'?-1:0)).map(([a,v])=>`<div class="card"><b>${esc(a==='Coordinator'?'Controller':a)}</b><p class="pill">Session: ${esc(v.kind==='manager'?'Experiment management':v.session_status??v.phase)}</p><p>Reported work: ${esc(v.work_state??v.phase)}</p><p>${esc(v.note)}</p><small>Unread: ${s.unread[a]??0}</small></div>`).join('');document.querySelector('#jobs').innerHTML=Object.values(s.jobs).filter(j=>j.status==='running').map(j=>`<p>${esc(j.arm)} · ${esc(j.type)} · ${esc(j.action_id)}</p>`).join('')||'No running actions';document.querySelector('#messages').innerHTML=s.messages.slice(-80).reverse().map(m=>`<tr><td>${m.message_id}${m.reply_to?' ↩ '+esc(m.reply_to):''}</td><td>${esc(m.from)} → ${esc(m.to.join(', '))}</td><td>${esc(m.text)}</td></tr>`).join('');document.querySelector('#events').textContent=s.events.filter(e=>!['VIDEO_FRAME','TOOL_RETURN'].includes(e.kind)).slice(-20).map(e=>`${e.created_at?new Date(e.created_at*1000).toLocaleTimeString('en-GB',{timeZone:'Asia/Hong_Kong',hour12:false}):e.wall_s+'s'} ${e.actor} ${e.kind}`).join('\n')}catch(e){document.querySelector('#run').textContent='Connection temporarily unavailable'} }setInterval(refresh,1500);refresh();</script>
