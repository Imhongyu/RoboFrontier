<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robo Factory</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8ebed;color:#25323b;font:14px system-ui,sans-serif}header{height:62px;padding:12px 24px;display:flex;align-items:center;gap:20px;background:#f8f9f8;border-bottom:1px solid #d0d6d9}h1{font-size:21px;letter-spacing:2px;margin:0}small{color:#6a7780}main{height:calc(100vh - 62px);display:grid;grid-template-columns:1fr 270px}.stage{min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px}.stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;touch-action:none;cursor:grab}aside{padding:22px 20px;background:#f3f5f5;overflow:auto;border-left:1px solid #d0d6d9}label{display:block;margin:0 0 9px;font-weight:600}select,button{font:inherit;border:1px solid #bcc6cc;border-radius:5px;background:white;color:#25323b;padding:9px;width:100%}button{cursor:pointer}button:hover{background:#e6eef1}.section{margin-bottom:24px}.layers label{font-weight:400;margin:9px 0}.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1}input[type=range]{width:100%}.note{line-height:1.7;color:#65717a;font-size:12px}.stats{font-variant-numeric:tabular-nums;color:#65717a;font-size:12px;line-height:1.8}#error{color:#9b3d2c;font-size:12px}kbd{background:#e3e7e9;padding:1px 5px;border-radius:3px}
@media(max-width:900px){header{padding:12px 16px;gap:12px}h1{font-size:18px}header small{font-size:11px}main{height:auto;grid-template-columns:1fr}.stage{height:58vh;min-height:300px;padding:8px}aside{display:grid;grid-template-columns:1fr 1fr;gap:16px;border-left:0;border-top:1px solid #d0d6d9;padding:18px 16px;overflow:visible}.section{margin-bottom:0}.note,.stats,#error{grid-column:1/-1}}
</style>
<header><h1>ROBO FACTORY</h1><small id="summary">Four reserved zones · Static building</small></header>
<main><div class="stage"><img id="scene" draggable="false" alt="Robo Factory three-dimensional scene"></div><aside>
<div class="section"><label>View</label><select id="preset"></select><div class="row"><button id="fit">Overview</button><button id="capture">Save image</button></div></div>
<div class="section"><label>Focus zone</label><select id="region"><option value="">Choose a zone…</option><option value="transport">Transport</option><option value="mosaic">Mosaic</option><option value="relay">Air Relay</option><option value="dial">Dial Lab</option></select></div>
<div class="section"><label>Field of view <span id="fovvalue">68°</span></label><input id="fov" type="range" min="25" max="100" value="68"></div>
<div class="section layers"><label>Building layers</label><label><input type="checkbox" data-layer="roof" checked> Roof and ceiling services</label><label><input type="checkbox" data-layer="north" checked> North wall</label><label><input type="checkbox" data-layer="south" checked> South wall</label><label><input type="checkbox" data-layer="west" checked> West wall</label><label><input type="checkbox" data-layer="east" checked> East wall</label></div>
<div class="section note">Drag: orbit<br>Shift + drag: pan<br>Wheel: zoom<br><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move<br><kbd>Q</kbd><kbd>E</kbd> Up / down<br><br>Legacy empty-building preview. Yellow lines mark four reserved zones.</div>
<div id="stats" class="stats"></div><div id="error"></div>
</aside></main>
<script>
const image=document.querySelector('#scene'),preset=document.querySelector('#preset');let moving=false,last=null,dragTime=0,activePreset='interior_south',lastFrame=-1;
const names={interior_south:'Interior · South entrance',interior_north:'Interior · North entrance',interior_diagonal:'Interior · Diagonal',interior_east:'Interior · East',detail_storage:'Detail · Services',detail_brand:'Detail · North wall and shutter',detail_ceiling:'Detail · Ceiling services',top:'Top',from_south:'Cutaway · From south',from_north:'Cutaway · From north',from_east:'Cutaway · From east',from_west:'Cutaway · From west'};
function post(data){return fetch('/camera',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});}
fetch('/cameras').then(r=>r.json()).then(c=>{for(const v of c){if(v.id==='interactive')continue;const o=document.createElement('option');o.value=v.id;o.textContent=names[v.id]||v.id;preset.append(o)}preset.value=activePreset;});
preset.onchange=()=>post({op:'preset',name:preset.value});document.querySelector('#fit').onclick=()=>post({op:'preset',name:'from_south'});document.querySelector('#capture').onclick=()=>post({op:'capture'});
document.querySelector('#region').onchange=e=>{if(e.target.value)post({op:'frame_region',name:e.target.value});};
const fov=document.querySelector('#fov');fov.oninput=()=>{document.querySelector('#fovvalue').textContent=fov.value+'°';post({vertical_fov_deg:Number(fov.value),projection:'perspective'});};
for(const c of document.querySelectorAll('[data-layer]'))c.onchange=()=>post({hidden_layers:Array.from(document.querySelectorAll('[data-layer]')).filter(x=>!x.checked).map(x=>x.dataset.layer)});
image.onpointerdown=e=>{moving=true;last=[e.clientX,e.clientY];image.setPointerCapture(e.pointerId);};image.onpointerup=()=>{moving=false;last=null};image.onpointermove=e=>{if(!moving)return;const now=performance.now();if(now-dragTime<70)return;const dx=e.clientX-last[0],dy=e.clientY-last[1];last=[e.clientX,e.clientY];dragTime=now;post({op:e.shiftKey?'pan':'orbit',dx,dy});};image.onwheel=e=>{e.preventDefault();post({op:'zoom',delta:e.deltaY});};
document.onkeydown=e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;const k=e.key.toLowerCase(),speed=e.shiftKey?2:.6;const m={w:{forward:speed},s:{forward:-speed},a:{right:-speed},d:{right:speed},q:{up:-speed},e:{up:speed}}[k];if(m){e.preventDefault();post({op:'move',...m})}};
async function refresh(){try{const s=await fetch('/state').then(r=>r.json());if(s.frames){document.querySelector('#summary').textContent=`${s.dimensions_m[0]} × ${s.dimensions_m[1]} m · Four reserved zones · Static building`;document.querySelector('#stats').textContent=`${s.resolution[0]} × ${s.resolution[1]} · ${s.renderer}\n${s.mean_frame_ms.toFixed(1)} ms / frame`;document.querySelector('#error').textContent=s.error||'';for(const x of document.querySelectorAll('[data-layer]'))x.checked=!s.camera_state.hidden_layers.includes(x.dataset.layer);if(!moving&&s.camera_state.vertical_fov_deg){fov.value=s.camera_state.vertical_fov_deg;document.querySelector('#fovvalue').textContent=Math.round(fov.value)+'°';}if(s.frames!==lastFrame){image.src='/frame.jpg?t='+Date.now();lastFrame=s.frames;}}}catch{}setTimeout(refresh,250);}refresh();
</script></html>
