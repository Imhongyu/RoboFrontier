# Shared defaults for new runs. Secrets belong in the environment or .env.
schema_version = 1

[policy]
engine = "codex"                     # codex | claude
profile = "luna"                     # An engine-specific model catalog entry
effort = "high"
topology = "adaptive"                # single | controller-worker | worker-worker | adaptive

[batch]
parallel = 36
startup_interval_s = 0.3              # Between host launches, never robot calls
task_wall_limit_s = 86400.0           # From persisted START, independently per task
startup_timeout_s = 600.0

[selection]
families = []                        # Empty selects all four released families
cases = []                           # Empty selects every matching released case
level = 0                            # 0 selects all levels; otherwise 1, 2 or 3
min_arms = false

[render]
device = "nvidia"                    # nvidia (Linux EGL) | cpu (Linux OSMesa) | native (macOS)
observation_profile = "jpeg_896x560_q85"
record_realtime_video = false

[runtime]
codex_home_scope = "task"             # API: task isolation; shared retains legacy authentication behavior
codex_home = ""                      # Empty uses an automatically created private directory

[evidence]
auto_collect = true
auto_archive = true
archive_format = "zip"
delete_sources = false               # Destructive cleanup is not part of automatic collection

[slurm]
partition = ""                       # Site-specific: use the cluster default when empty
account = ""
qos = ""
gpus = 1                             # Set to 0 with render.device = "cpu"
cpus_per_task = 36
memory_gib = 128                      # A resource request, not a measured capacity guarantee
time_limit_s = 90000                  # Allocation lifetime, separate from the task clock
stop_warning_s = 600                 # Stop and collect before allocation expiry
scratch_root = ""                    # Empty requires the node's SLURM_TMPDIR

[container]
image = ""                           # Empty selects a tag from the committed source revision
workspace = "default"                # Persistent local Docker volumes, separate from host Codex state
memory_gib = 0                       # 0 adds no limit beyond the Docker daemon/allocation
cpus = 0.0                           # 0 adds no CPU quota
